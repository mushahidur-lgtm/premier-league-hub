<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Unofficial Premier League fan site: live table, fixtures, club pages, news and match centre for all 20 clubs."
    />
    <meta name="theme-color" content="#fafbf8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='10' y='3' width='12' height='26' rx='6' fill='%231f5135'/%3E%3C/svg%3E"
    />
    <!-- Link previews. Absolute URLs: keep them in step with BASE in src/config/site.js.
         public/og.png is drawn by `npm run screenshots`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Premier League Hub" />
    <meta property="og:title" content="Premier League Hub: table, fixtures and news for all 20 clubs" />
    <meta
      property="og:description"
      content="Unofficial fan site: live table, fixtures in your timezone, club pages, squads with injury reports, news and match centre."
    />
    <meta property="og:url" content="https://mushahidur.gitlab.io/premier-league-hub/" />
    <meta property="og:image" content="https://mushahidur.gitlab.io/premier-league-hub/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Premier League Hub, with a strip of the 20 clubs' colours. Unofficial fan site."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://site.api.espn.com" crossorigin />
    <link rel="preconnect" href="https://a.espncdn.com" />
    <title>Premier League Hub</title>
    <!-- Theme before first paint, so a dark page never flashes white. Same rule as src/lib/theme.js. -->
    <script>
      (function () {
        var p = "system";
        try {
          p = localStorage.getItem("plh-theme") || "system";
        } catch (e) {}
        var dark =
          p === "dark" || (p !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e1512");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
